<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#070b14" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>Brain Snapshot · Mission Control</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="top">
    <div>
      <div class="brand">Moonshadow Studio</div>
      <h1>Brain Snapshot</h1>
    </div>
    <div class="meta">
      <a class="link" href="/">← Mission Control</a>
      <button type="button" class="btn sm" id="copy-brain-md" title="Copy snapshot as Markdown">Copy Brain MD</button>
      <div id="stamp">loading…</div>
    </div>
  </header>
  <main class="grid brain-grid">
    <section class="panel">
      <h2>Source</h2>
      <div id="source" class="empty">…</div>
    </section>
    <section class="panel">
      <h2>Core rule</h2>
      <div id="core" class="empty">…</div>
    </section>
    <section class="panel">
      <h2>Roster (verified)</h2>
      <div id="roster"></div>
    </section>
    <section class="panel">
      <h2>Active assignments</h2>
      <div id="assignments"></div>
    </section>
    <section class="panel activity-panel">
      <h2>Notes</h2>
      <div id="notes" class="empty">…</div>
    </section>
  </main>
  <script>
    let lastSnapshot = null;

    function pill(text) {
      const v = String(text || "").toUpperCase();
      let t = "cyan";
      if (/(COMPLETE|VERIFIED|ACTIVE|ONLINE|OK)/.test(v) && !/UNVERIFIED|NOT /.test(v)) t = "ok";
      else if (/(BLOCKED|404|UNKNOWN|PENDING|OFFLINE)/.test(v)) t = "bad";
      else if (/(ASSIGNED|STANDBY|REPORTED)/.test(v)) t = "warn";
      return `<span class="pill ${t}">${text}</span>`;
    }

    function snapshotToMarkdown(s) {
      if (!s) return "";
      const lines = [];
      lines.push("# Studio Brain Snapshot (read-only)");
      lines.push("");
      lines.push(`- Snapshot at: ${s.snapshotAt || ""}`);
      lines.push(`- Live: ${s.live ? "YES" : "NO (fallback)"}`);
      if (s.fetchError) lines.push(`- Fetch note: ${s.fetchError}`);
      lines.push(`- Source: ${s.source?.repo || ""} / ${s.source?.path || ""} (${s.source?.branch || ""})`);
      lines.push(`- Custodian: ${s.source?.custodian || ""} · Authority: ${s.source?.authority || ""}`);
      lines.push("");
      lines.push("## Core rule");
      lines.push("");
      lines.push(s.coreRule || "");
      lines.push("");
      lines.push("## Roster");
      lines.push("");
      lines.push("| Name | Role | Status | Lane |");
      lines.push("| --- | --- | --- | --- |");
      (s.roster || []).forEach((r) => {
        lines.push(`| ${r.name || ""} | ${r.role || ""} | ${r.status || ""} | ${r.lane || ""} |`);
      });
      lines.push("");
      lines.push("## Assignments");
      lines.push("");
      lines.push("| ID | Owner | Title | Status | Evidence |");
      lines.push("| --- | --- | --- | --- | --- |");
      (s.assignments || []).forEach((a) => {
        lines.push(`| ${a.id || ""} | ${a.owner || ""} | ${a.title || ""} | ${a.status || ""} | ${a.evidence || ""} |`);
      });
      lines.push("");
      lines.push("## Notes");
      lines.push("");
      (s.notes || []).forEach((n) => lines.push(`- ${n}`));
      lines.push("");
      lines.push("---");
      lines.push("Read-only. Canonical memory remains studio-behind-the-cast/STUDIO_BRAIN.md. Does not write the Brain.");
      return lines.join("\n");
    }

    async function copyBrainMd() {
      const btn = document.getElementById("copy-brain-md");
      if (!lastSnapshot) {
        alert("Snapshot not loaded yet");
        return;
      }
      const md = snapshotToMarkdown(lastSnapshot);
      try {
        await navigator.clipboard.writeText(md);
        if (btn) {
          const prev = btn.textContent;
          btn.textContent = "Copied";
          setTimeout(() => { btn.textContent = prev; }, 1600);
        }
      } catch (err) {
        // Fallback for older Android WebViews
        const ta = document.createElement("textarea");
        ta.value = md;
        ta.style.position = "fixed";
        ta.style.left = "-9999px";
        document.body.appendChild(ta);
        ta.select();
        try {
          document.execCommand("copy");
          if (btn) {
            const prev = btn.textContent;
            btn.textContent = "Copied";
            setTimeout(() => { btn.textContent = prev; }, 1600);
          }
        } catch (e2) {
          alert("Copy failed — select manually from console or re-try");
        }
        document.body.removeChild(ta);
      }
    }

    async function load() {
      const res = await fetch("/api/brain-snapshot");
      const s = await res.json();
      lastSnapshot = s;
      const liveTag = s.live ? " · LIVE" : (s.fetchError ? " · FALLBACK" : "");
      document.getElementById("stamp").textContent = (s.snapshotAt || "") + liveTag;
      document.getElementById("source").innerHTML = `
        <div class="name">${s.source?.repo || ""}</div>
        <div class="lane">Path: ${s.source?.path || ""} · Branch: ${s.source?.branch || ""}</div>
        <div class="lane">Custodian: ${s.source?.custodian || ""} · Authority: ${s.source?.authority || ""}</div>
        <div class="lane">Status: ${pill(s.source?.status || "")}</div>
        <p style="margin-top:10px;color:var(--mute);font-size:13px">${s.disclaimer || ""}</p>
        <a class="link" href="${s.source?.url || "#"}" target="_blank" rel="noreferrer">open Brain repo</a>
      `;
      document.getElementById("core").innerHTML = `<p style="margin:0;line-height:1.5">${s.coreRule || ""}</p>`;
      document.getElementById("roster").innerHTML = (s.roster || []).map((r) => `
        <div class="row">
          <div>
            <div class="name">${r.name}</div>
            <div class="lane">${r.role} — ${r.lane}</div>
          </div>
          ${pill(r.status)}
        </div>
      `).join("") || `<div class="empty">No roster in snapshot</div>`;
      document.getElementById("assignments").innerHTML = (s.assignments || []).map((a) => `
        <div class="row">
          <div>
            <div class="name">${a.id} · ${a.title}</div>
            <div class="lane">${a.owner} · ${a.evidence}</div>
          </div>
          ${pill(a.status)}
        </div>
      `).join("") || `<div class="empty">No assignments in snapshot</div>`;
      document.getElementById("notes").innerHTML = `
        <ul style="margin:0;padding-left:18px;color:var(--mute);font-size:13px;line-height:1.6">
          ${(s.notes || []).map((n) => `<li>${n}</li>`).join("")}
        </ul>
      `;
    }

    document.getElementById("copy-brain-md").addEventListener("click", copyBrainMd);
    load().catch((err) => {
      document.getElementById("source").textContent = "Snapshot load failed: " + err.message;
    });
  </script>
</body>
</html>
